services:
  postgres:
    image: postgres:16-alpine
    container_name: lexa-postgres
    environment:
      POSTGRES_USER: lexa
      POSTGRES_PASSWORD: lexa
      POSTGRES_DB: lexa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lexa']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
